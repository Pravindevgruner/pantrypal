AWSTemplateFormatVersion: '2010-09-09'
Description: 'PantryPal Admin Dashboard - Amazon S3 + CloudFront Distribution with Origin Access Control (OAC)'

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    Description: Environment name prefix

  ALBDNSName:
    Type: String
    Default: production-pantrypal-alb-65279938.ap-south-1.elb.amazonaws.com
    Description: DNS Name of the Application Load Balancer to proxy /api requests

Resources:
  # S3 Bucket for Admin Static SPA Build
  AdminS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'pantrypal-admin-${AWS::AccountId}-ap-south-1'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-pantrypal-admin-bucket'

  # CloudFront Origin Access Control (OAC)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${EnvironmentName}-admin-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Distribution
  AdminCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'PantryPal Admin Dashboard (${EnvironmentName})'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200 # Covers Asia/India/Mumbai efficiently
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt AdminS3Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
          - Id: ALBOrigin
            DomainName: !Ref ALBDNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        # Single-Page Application (SPA) Error Responses: Return index.html on deep client-side routes
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  # S3 Bucket Policy allowing CloudFront OAC read access
  AdminBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${AdminS3Bucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminCloudFrontDistribution}'

Outputs:
  AdminBucketName:
    Value: !Ref AdminS3Bucket
    Description: Name of S3 bucket hosting Admin Panel files

  CloudFrontDomainName:
    Value: !GetAtt AdminCloudFrontDistribution.DomainName
    Description: HTTPS URL to access Admin Dashboard on CloudFront

  CloudFrontDistributionId:
    Value: !Ref AdminCloudFrontDistribution
    Description: Distribution ID for cache invalidations
